---
- name: Harden host — user management, SSH and fail2ban
  hosts: thumbgen
  become: true
  gather_facts: true
  vars:
    deploy_user: deploy

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

  tasks:
    - name: Harden user management, SSH and fail2ban
      ansible.builtin.include_tasks: tasks/harden.yml

- name: Provision rootless Docker runtime
  hosts: thumbgen
  become: true
  gather_facts: true
  vars:
    deploy_user: deploy

  tasks:
    - name: Provision rootless Docker runtime
      ansible.builtin.include_tasks: tasks/docker.yml