---
- name: Check for existing git checkout
  ansible.builtin.stat:
    path: "{{ deploy_dir }}/.git"
  register: deploy_git_dir

- name: Remove stale deploy directory (from pre-git layout)
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: absent
  become: true
  when: not deploy_git_dir.stat.exists

- name: Ensure deploy directory exists and is owned by deploy user
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0755"
  become: true

- name: Take ownership of existing deploy directory (migration from root)
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    recurse: true
  become: true
  when: deploy_git_dir.stat.exists

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Resolve deploy user UID for rootless Docker socket
  ansible.builtin.command: id -u
  changed_when: false
  register: deploy_uid_cmd

- name: Set rootless Docker host fact
  ansible.builtin.set_fact:
    docker_host: "unix:///run/user/{{ deploy_uid_cmd.stdout }}/docker.sock"

- name: Clone application repository
  ansible.builtin.git:
    repo: "{{ git_repo_clone }}"
    dest: "{{ deploy_dir }}"
    version: main
    force: true

- name: Strip token from origin remote
  ansible.builtin.command: "git remote set-url origin {{ git_repo }}"
  args:
    chdir: "{{ deploy_dir }}"
  when: git_repo_token | default('') | length > 0

- name: Render production .env from secrets
  ansible.builtin.template:
    src: templates/env.j2
    dest: "{{ deploy_dir }}/.env"
    mode: "0600"

- name: Deploy stack via rootless Docker (build + up, force-recreate)
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_dir }}"
    files: "{{ compose_file }}"
    build: always
    state: present
    pull: missing
    recreate: always
  environment:
    DOCKER_HOST: "{{ docker_host }}"

- name: Show container status
  ansible.builtin.command: "docker compose -f {{ compose_file }} ps"
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  register: stack_status
  changed_when: false

- name: Print container status
  ansible.builtin.debug:
    var: stack_status.stdout

- name: Wait for health endpoint
  ansible.builtin.uri:
    url: "{{ healthz_url }}"
    method: GET
    status_code: 200
    timeout: 5
  register: health
  until: health.status is defined and health.status == 200
  retries: 24
  delay: 5
  ignore_errors: true

- name: Collect diagnostic logs
  ansible.builtin.command: "docker compose -f {{ compose_file }} logs --tail=100"
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  register: diag_logs
  changed_when: false
  when: health.status is defined and health.status != 200

- name: Print diagnostic logs
  ansible.builtin.debug:
    var: diag_logs.stdout
  when: health.status is defined and health.status != 200

- name: Fail if stack is unhealthy
  ansible.builtin.fail:
    msg: "Health endpoint {{ healthz_url }} did not return 200"
  when: health.status is defined and health.status != 200