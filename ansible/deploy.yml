---
- name: Deploy thumbgen stack
  hosts: thumbgen
  become: true
  vars:
    deploy_dir: /opt/thumbgen
    compose_file: docker-compose.prod.yml
    healthz_url: "http://{{ domain }}/healthz"
    git_repo: https://github.com/AstroPhySam/thumb-gen-lab.git
    git_repo_clone: >-
      {{ 'https://x-access-token:' ~ git_repo_token ~ '@github.com/AstroPhySam/thumb-gen-lab.git'
         if (git_repo_token | default('') | length > 0)
         else 'https://github.com/AstroPhySam/thumb-gen-lab.git' }}

  tasks:
    - name: Install and enable Docker runtime
      ansible.builtin.include_tasks: tasks/docker.yml

    - name: Deploy the thumbgen application stack
      ansible.builtin.include_tasks: tasks/deploy.yml

- name: Harden host — user management, SSH and fail2ban
  hosts: thumbgen
  become: true
  gather_facts: true
  vars:
    deploy_user: deploy

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

  tasks:
    - name: Harden user management, SSH and fail2ban
      ansible.builtin.include_tasks: tasks/harden.yml
