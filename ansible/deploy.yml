---
- name: Deploy thumbgen stack
  hosts: thumbgen
  become: true
  vars:
    deploy_dir: /opt/thumbgen
    compose_file: docker-compose.prod.yml
    healthz_url: "http://{{ domain }}/healthz"

  tasks:
    - name: Install Docker engine, buildx and compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-buildx
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create deploy directory layout
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ deploy_dir }}"
        - "{{ deploy_dir }}/frontend"
        - "{{ deploy_dir }}/py-mono"

    - name: Copy compose file and Caddyfile
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ deploy_dir }}/"
        mode: "0644"
      loop:
        - ../docker-compose.prod.yml
        - ../Caddyfile

    - name: Copy frontend
      ansible.builtin.copy:
        src: ../frontend/
        dest: "{{ deploy_dir }}/frontend/"
        mode: "0644"

    - name: Copy py-mono build inputs
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - {
            src: ../py-mono/Dockerfile,
            dest: "{{ deploy_dir }}/py-mono/Dockerfile",
          }
        - {
            src: ../py-mono/pyproject.toml,
            dest: "{{ deploy_dir }}/py-mono/pyproject.toml",
          }
        - { src: ../py-mono/uv.lock, dest: "{{ deploy_dir }}/py-mono/uv.lock" }
        - { src: ../py-mono/src/, dest: "{{ deploy_dir }}/py-mono/src/" }

    - name: Render production .env from secrets
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"

    - name: Deploy stack (build + up)
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        files: "{{ compose_file }}"
        build: always
        state: present
        pull: missing

    - name: Wait for health endpoint
      ansible.builtin.uri:
        url: "{{ healthz_url }}"
        method: GET
        status_code: 200
        timeout: 5
      register: health
      until: health.status is defined and health.status == 200
      retries: 24
      delay: 5
