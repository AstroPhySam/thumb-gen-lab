name: AWS Server Setup

on:
  workflow_dispatch:
    inputs:
      ssh_user:
        description: "ubuntu for first bootstrap, admin after hardening"
        required: true
        default: ubuntu
        type: choice
        options:
          - ubuntu
          - root
          - admin

permissions:
  contents: read

jobs:
  setup:
    name: Provision and harden AWS server
    runs-on: ubuntu-latest
    env:
      INSTANCE_IP: ${{ vars.AWS_INSTANCE_IP }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if instance IP is not set
        if: env.INSTANCE_IP == ''
        run: |
          echo "::error::AWS_INSTANCE_IP is not set. Run 'AWS Terraform Apply' first so it records the instance IP."
          exit 1

      - name: Run Ansible (setup)
        uses: ./.github/actions/ansible-run
        with:
          playbook: ansible/setup.yml
          ssh_user: ${{ inputs.ssh_user }}