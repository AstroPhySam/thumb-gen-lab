name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm terraform destroy"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Guard destroy confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "::error::Destroy requires confirm input to be 'DESTROY'"
            exit 1
          fi

      - name: Write SSH public key
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > "$RUNNER_TEMP/civo-thumbgen.pub"

      - name: Terraform init
        run: terraform init

      - name: Terraform destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_ssh_public_key_path: ${{ runner.temp }}/civo-thumbgen.pub
          TF_VAR_ssh_private_key_path: ${{ runner.temp }}/civo-thumbgen

      - name: Clear instance IP variable for Deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh variable delete INSTANCE_IP --repo "${{ github.repository }}" || true
