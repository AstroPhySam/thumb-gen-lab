name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Write SSH public key
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > "$RUNNER_TEMP/civo-thumbgen.pub"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan
        env:
          TF_VAR_ssh_public_key_path: ${{ runner.temp }}/civo-thumbgen.pub
          TF_VAR_ssh_private_key_path: ${{ runner.temp }}/civo-thumbgen
