name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/civo
    env:
      CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Write SSH public key
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > "$RUNNER_TEMP/civo-thumbgen.pub"

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_ssh_public_key_path: ${{ runner.temp }}/civo-thumbgen.pub
          TF_VAR_ssh_private_key_path: ${{ runner.temp }}/civo-thumbgen

      - name: Record instance IP for Deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          IP="$(terraform output -raw instance_public_ip)"
          gh variable set INSTANCE_IP --repo "${{ github.repository }}" --body "$IP"
