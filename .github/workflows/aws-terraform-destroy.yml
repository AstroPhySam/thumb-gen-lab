name: AWS Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm terraform destroy"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_domain: ""

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Guard destroy confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "::error::Destroy requires confirm input to be 'DESTROY'"
            exit 1
          fi

      - name: Write SSH public key
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > "$RUNNER_TEMP/thumbgen-aws.pub"

      - name: Terraform init
        run: terraform init

      - name: Terraform destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_ssh_public_key_path: ${{ runner.temp }}/thumbgen-aws.pub
          TF_VAR_ssh_private_key_path: ${{ runner.temp }}/thumbgen-aws

      - name: Clear AWS repo variables/secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh variable delete AWS_INSTANCE_IP --repo "$GH_REPO" || true
          gh variable delete ECR_REGISTRY --repo "$GH_REPO" || true
          gh variable delete MINIO_REGION --repo "$GH_REPO" || true
          gh variable delete MINIO_BUCKET_ORIGINALS --repo "$GH_REPO" || true
          gh variable delete MINIO_BUCKET_THUMBNAILS --repo "$GH_REPO" || true
          gh secret delete MINIO_ACCESS_KEY --repo "$GH_REPO" || true
          gh secret delete MINIO_SECRET_KEY --repo "$GH_REPO" || true
          gh secret delete AWS_ROLE_ARN --repo "$GH_REPO" || true